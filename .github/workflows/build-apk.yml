name: Simple Build Test
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node & Java Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install & Init
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "TestApp" "com.strobe.game" --web-dir www
          npx cap add android
          # إعدادات بسيطة جداً لمنع تعارض المكتبات
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          # هذه السطر هو الأساس لحل مشكلة الـ Duplicate Class
          echo "configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22' } }" >> android/app/build.gradle

      - name: Build
        run: |
          cd android
          ./gradlew clean assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
