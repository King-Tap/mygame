name: Build Strobe Game APK (Nuclear)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # استخدام Java 17 بدلاً من 21 لأنه الأكثر استقراراً مع Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "ستروب قيم" "com.strobe.game" --web-dir www
          npx cap add android
          
          # [NUCLEAR OPTION] فرض إعدادات Gradle بالقوة
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          
          # [NUCLEAR OPTION] تعديل ملف build.gradle لإصلاح مشاكل Kotlin و Java
          # نستخدم sed للبحث عن compileOptions وإجبارها على نسخة 17
          sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_[0-9]*/sourceCompatibility = JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i 's/targetCompatibility = JavaVersion.VERSION_1_[0-9]*/targetCompatibility = JavaVersion.VERSION_17/g' android/app/build.gradle
          
          # [NUCLEAR OPTION] إجبار كل المكتبات على استخدام نسخة واحدة من kotlin-stdlib لتجنب الـ Duplicate class
          sed -i '/dependencies {/a \    configurations.all { resolutionStrategy { force "org.jetbrains.kotlin:kotlin-stdlib:1.9.20" } }' android/app/build.gradle
          
          # مسح أيقونات الأندرويد الافتراضية
          rm -rf android/app/src/main/res/mipmap-*
          
          # إنشاء المجلدات ووضع الأيقونات
          mkdir -p android/app/src/main/res/mipmap-hdpi
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-mdpi && cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi && cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi && cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi && cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Final Compilation
        run: |
          npx cap copy
          cd android && ./gradlew assembleDebug

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: Strobe-Game-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
