name: Build Strobe Game APK (Extreme Reset)
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Essential Tools
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Build Web and Android
        run: |
          mkdir -p www
          cp index.html www/
          npx cap init "StrobeGame" "com.strobe.game" --web-dir www
          npx cap add android
          
          # 1. تنظيف الـ Cache تماماً
          rm -rf android/.gradle
          
          # 2. فرض إعدادات الجرادل الأساسية
          echo "android.useAndroidX=true" > android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          
          # 3. [الأهم] فرض نسخة Kotlin موحدة على مستوى المشروع بالكامل (Root level)
          # نضع هذا في نهاية ملف build.gradle الرئيسي وليس app/build.gradle
          echo "allprojects { configurations.all { resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22' } } }" >> android/build.gradle
          
          # مسح أيقونات الأندرويد الافتراضية
          rm -rf android/app/src/main/res/mipmap-*
          
          # إنشاء المجلدات ووضع الأيقونات
          mkdir -p android/app/src/main/res/mipmap-hdpi && cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-hdpi && cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          mkdir -p android/app/src/main/res/mipmap-mdpi && cp icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xhdpi && cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxhdpi && cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi && cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Final Compilation
        run: |
          npx cap copy
          cd android
          # تنظيف ثم بناء
          ./gradlew clean assembleDebug

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: Strobe-Game-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
